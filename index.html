<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOMBLOBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--panel:rgba(18,16,40,.82);--edge:rgba(255,255,255,.12);--acc:#ffcf3f;--acc2:#ff4d6d;--good:#5be37d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1636;color:var(--ink);font-family:Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
#app{position:fixed;inset:0}
.hidden{display:none!important}
.title{font-family:'Lilita One',Impact,sans-serif;letter-spacing:2px}
button{font-family:'Lilita One',Impact,sans-serif;font-size:20px;letter-spacing:1px;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;color:#241a00;background:var(--acc);box-shadow:0 5px 0 #b8860b;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b8860b}
button.sec{background:#5a5f8f;color:#fff;box-shadow:0 5px 0 #383b60}
button.red{background:var(--acc2);color:#fff;box-shadow:0 5px 0 #a3203b}
button.small{font-size:15px;padding:8px 12px;border-radius:10px}
button:disabled{opacity:.45;pointer-events:none}
input[type=text]{font-family:'Lilita One',sans-serif;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid var(--edge);background:rgba(0,0,0,.35);color:#fff;outline:none;width:100%;letter-spacing:1px}
input[type=text]:focus{border-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:22px;padding:22px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at center,rgba(20,10,50,0) 30%,rgba(10,5,30,.55) 100%)}
#logo{font-size:clamp(56px,9vw,120px);line-height:.9;color:#fff;text-shadow:0 6px 0 #ff4d6d,0 12px 0 #7a1fa2,0 18px 30px rgba(0,0,0,.5);animation:bob 2.4s ease-in-out infinite;margin-bottom:10px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-8px) rotate(2deg) scale(1.03)}}
#menuCard{width:min(440px,92vw);display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
#swatches{display:flex;gap:8px;justify-content:space-between}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);flex:none}
.sw.on{border-color:#fff;transform:scale(1.12)}
.lbl{font-size:13px;opacity:.7;font-weight:800;text-transform:uppercase;letter-spacing:1px}
#status{min-height:20px;text-align:center;font-weight:800;color:#ffd0d8}
#lobby{position:fixed;left:24px;top:50%;transform:translateY(-50%);width:min(380px,90vw);display:flex;flex-direction:column;gap:12px;max-height:94vh;overflow:auto}
#codeBox{display:flex;align-items:center;gap:10px;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:14px;padding:10px 14px}
#codeTxt{font-size:44px;color:var(--acc);letter-spacing:6px}
#plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;font-weight:800}
.dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.pl .tag{margin-left:auto;font-size:12px;opacity:.6}
.stepper{display:flex;align-items:center;gap:8px}
.stepper span{min-width:28px;text-align:center;font-family:'Lilita One';font-size:24px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button.on{background:#fff;color:#241a00;box-shadow:0 5px 0 #aaa}
#hud{position:fixed;inset:0;pointer-events:none}
#topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#timer{font-family:'Lilita One';font-size:44px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#timer.hot{color:#ff6b6b;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#roundTxt{font-family:'Lilita One';font-size:16px;opacity:.85;letter-spacing:2px}
#board{position:absolute;top:14px;right:16px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.br{display:flex;align-items:center;gap:8px;background:rgba(10,8,30,.55);border-radius:10px;padding:5px 10px;font-weight:800;font-size:15px}
.br.me{outline:2px solid rgba(255,255,255,.7)}
.br b{margin-left:auto;font-family:'Lilita One';font-size:20px}
#feed{position:absolute;top:14px;left:16px;display:flex;flex-direction:column;gap:5px}
.fd{background:rgba(10,8,30,.6);border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px;animation:fin .25s ease-out;display:flex;gap:7px;align-items:center}
@keyframes fin{from{transform:translateX(-30px);opacity:0}}
#cross{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%)}
#cross svg{width:100%;height:100%}
#heatBox{position:absolute;left:26px;bottom:58px;display:flex;align-items:flex-end;gap:10px}
#heatV{font-family:'Lilita One';font-size:64px;line-height:.9;text-shadow:0 4px 0 rgba(0,0,0,.45);transition:color .2s}
#heatBox small{font-family:'Lilita One';font-size:26px;margin-bottom:6px;opacity:.85}
#pips{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;margin-left:8px}
.pip{width:110px;height:9px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden}
.pip i{display:block;height:100%;width:100%;background:var(--acc);border-radius:9px}
.pip.d i{background:#7ad7ff}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,8,30,.6);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap;transition:opacity .6s;display:flex;gap:14px}
#hint kbd{font-family:'Lilita One';background:rgba(255,255,255,.16);border-radius:6px;padding:1px 5px;margin-right:3px;font-size:12px;font-weight:400}
#hint span{white-space:nowrap}
#center{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:'Lilita One';font-size:110px;text-shadow:0 6px 0 rgba(0,0,0,.4);white-space:nowrap}
.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
#tags{position:absolute;inset:0;overflow:hidden}
.nt{position:absolute;transform:translate(-50%,-100%);text-align:center;font-weight:800;font-size:13px;text-shadow:0 2px 3px rgba(0,0,0,.7);white-space:nowrap;line-height:1.05}
.nt b{display:block;font-family:'Lilita One';font-size:17px;font-weight:400}
#banner{position:absolute;top:84px;left:50%;transform:translateX(-50%);background:rgba(10,8,30,.6);border-radius:12px;padding:6px 14px;font-weight:800;font-size:14px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,25,.45)}
#overlay .panel{width:min(520px,92vw);display:flex;flex-direction:column;gap:12px;align-items:stretch;max-height:92vh;overflow:auto}
#overlay h2{margin:0;text-align:center;font-size:40px}
.st{width:100%;border-collapse:collapse;font-weight:800}
.st td{padding:7px 8px;border-bottom:1px solid var(--edge)}
.st td.n{text-align:right;font-family:'Lilita One';font-size:20px}
.st tr.first td{color:var(--acc)}
#winName{text-align:center;font-family:'Lilita One';font-size:54px;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.slider{display:flex;align-items:center;gap:10px;font-weight:800}
.slider input{flex:1;accent-color:var(--acc)}
#clickPlay{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);font-family:'Lilita One';font-size:26px;background:rgba(10,8,30,.7);padding:10px 22px;border-radius:14px;pointer-events:none;animation:pulse .8s infinite alternate}
#fps{position:fixed;right:6px;bottom:4px;font-size:11px;opacity:.4}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#vign{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(255,40,40,0);transition:box-shadow .2s}
@media (max-height:800px){#logo{font-size:72px}#menuCard{gap:9px}.panel{padding:16px}button{font-size:18px;padding:10px 16px}#center{font-size:84px}#heatV{font-size:52px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div><div id="vign"></div>

<div id="hud" class="hidden">
  <div id="feed"></div>
  <div id="topbar"><div id="timer"></div><div id="roundTxt"></div></div>
  <div id="board"></div>
  <div id="tags"></div>
  <div id="cross"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="3" fill="#fff" stroke="#000" stroke-opacity=".4"/><circle id="cdRing" cx="23" cy="23" r="17" fill="none" stroke="#ffcf3f" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="107" stroke-dashoffset="0" transform="rotate(-90 23 23)" opacity=".85"/></svg></div>
  <div id="heatBox"><div id="heatV">0</div><small>%</small><div id="pips"><div class="pip" id="pipT"><i></i></div><div class="pip d" id="pipD"><i></i></div></div></div>
  <div id="banner" class="hidden"></div>
  <div id="hint"><span><kbd>WASD</kbd>move</span><span><kbd>Mouse</kbd>aim</span><span><kbd>Click</kbd>/<kbd>F</kbd>bomb (hold = far)</span><span><kbd>Right-click</kbd>/<kbd>Shift</kbd>/<kbd>E</kbd>dash</span><span><kbd>Space</kbd>jump ×2</span><span><kbd>←→↑↓</kbd>look</span><span><kbd>Tab</kbd>scores</span><span><kbd>H</kbd>hide</span></div>
  <div id="center"></div>
</div>
<div id="clickPlay" class="hidden">Click to play</div>

<div id="menu">
  <div id="logo" class="title">BOOMBLOBS</div>
  <div id="menuCard" class="panel">
    <div class="lbl">Your blob</div>
    <input id="nameIn" type="text" maxlength="12" placeholder="Name">
    <div id="swatches"></div>
    <button id="bSolo">PLAY SOLO</button>
    <div class="row"><button id="bHost" class="sec">HOST ONLINE</button></div>
    <div class="row"><input id="codeIn" type="text" maxlength="4" placeholder="CODE" style="text-transform:uppercase;text-align:center;letter-spacing:6px"><button id="bJoin" class="sec">JOIN</button></div>
    <div id="status"></div>
  </div>
</div>

<div id="lobby" class="panel hidden">
  <div class="title" style="font-size:30px">LOBBY</div>
  <div id="codeWrap"><div class="lbl">Room code — share it with friends</div>
    <div id="codeBox"><span id="codeTxt" class="title">----</span><button id="bCopy" class="small sec">COPY LINK</button></div></div>
  <div class="lbl">Players</div>
  <div id="plist"></div>
  <div id="hostOpts">
    <div class="row" style="margin-bottom:10px"><div class="lbl">Bots</div><div class="stepper" style="flex:none"><button class="small sec" id="botM">−</button><span id="botN">3</span><button class="small sec" id="botP">+</button></div></div>
    <div class="lbl" style="margin-bottom:6px">Rounds</div>
    <div class="seg" id="roundSeg"><button class="small sec" data-r="1">1</button><button class="small sec on" data-r="3">3</button><button class="small sec" data-r="5">5</button></div>
  </div>
  <div id="waitTxt" class="hidden" style="text-align:center;font-weight:800;opacity:.8">Waiting for the host to start…</div>
  <button id="bStart">START</button>
  <div class="row"><button id="bPlayLobby" class="sec small">WARM UP</button><button id="bLeave" class="red small">LEAVE</button></div>
</div>

<div id="overlay" class="hidden"><div class="panel" id="ovPanel"></div></div>
<div id="fps"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const V3 = THREE.Vector3;

// ================================================================ CONSTANTS
const TILE = 2, N = 12, GW = 2 * N + 1, ISLAND_R = 10.4;
const STEP = 1 / 60;
const GRAV = -30, BOMB_G = -24;
const PR = 0.55;                       // player radius
const MAX_SPEED = 9.5, ACC_G = 75, ACC_A = 24;
const JUMP_V = 12.5, DJUMP_V = 11.5;
const DASH_V = 24, DASH_T = 0.22, DASH_CD = 0.85;
const BOMB_R = 0.38, BOMB_FUSE = 1.75, BOMB_EXR = 4.6, BOMB_POW = 16;
const BARREL_R = 0.62, BARREL_H = 1.3, BARREL_EXR = 6.6, BARREL_POW = 23;
const THROW_CD = 0.45, MAX_PLAYERS = 6, ROUND_LEN = +(new URLSearchParams(location.search).get('len') || 100), SUDDEN = 22;
const COLORS = ['#ff4d5e', '#3fa7ff', '#ffd23f', '#4fe07a', '#b77dff', '#ff8c3a', '#35eadb', '#ff6fc2'];
const BOT_NAMES = ['Bolt', 'Fizz', 'Pop', 'Dyna', 'Kibo', 'Zap', 'Nova', 'Puck'];
const LOOP = new URLSearchParams(location.search).has('loop');   // local test transport

// ================================================================ UTILS
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const r2 = v => Math.round(v * 100) / 100;
const $ = id => document.getElementById(id);
function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function hash2(i, j) { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); }
const store = { get(k, d) { try { const v = localStorage.getItem('bb_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('bb_' + k, JSON.stringify(v)); } catch (e) { } } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ================================================================ AUDIO (all synthesized)
const Snd = {
  ctx: null, vol: store.get('vol', 0.7), musicOn: store.get('mus', true), busy: 0,
  init() {
    if (this.ctx) return; const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = this.vol; this.master.connect(comp);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0.0; this.mus.connect(this.master);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.noise = b;
    this.startMusic();
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVol(v) { this.vol = v; store.set('vol', v); if (this.master) this.master.gain.value = v; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  tone(type, f0, f1, dur, vol, delay = 0, dest) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    const g = c.createGain(); this.env(g, t, 0.006, vol, dur); o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  nz(ftype, f0, f1, dur, vol, q = 1, delay = 0, dest) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise; s.playbackRate.value = rand(0.85, 1.15);
    const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    const g = c.createGain(); this.env(g, t, 0.004, vol, dur); s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, rand(0, 1.2)); s.stop(t + dur + 0.1);
  },
  dv(d) { return clamp(1.3 / (1 + d * 0.05), 0.06, 1); },
  boom(size, d) {
    if (!this.ctx || this.busy > 6) return; this.busy++; setTimeout(() => this.busy--, 250);
    const v = this.dv(d);
    this.nz('lowpass', 2600 * size, 50, 0.7 * size + 0.35, 0.95 * v, 0.8);
    this.tone('sine', 120, 26, 0.55 * size + 0.25, 1.0 * v);
    this.tone('triangle', 70, 30, 0.4 * size, 0.5 * v);
    this.nz('highpass', 4000, 1500, 0.12, 0.35 * v, 0.6);
  },
  throw_() { this.nz('bandpass', 700, 2600, 0.16, 0.35, 2); this.tone('sine', 300, 600, 0.08, 0.12); },
  bounce(d) { this.tone('sine', rand(380, 460), 170, 0.09, 0.22 * this.dv(d)); },
  jump() { this.tone('square', 210, 560, 0.13, 0.08); this.tone('sine', 240, 620, 0.14, 0.18); },
  djump() { this.tone('sine', 400, 900, 0.14, 0.18); },
  dash(d = 0) { this.nz('highpass', 900, 5000, 0.2, 0.32 * this.dv(d), 0.7); },
  land(v) { this.tone('sine', 140, 60, 0.12, clamp(v, 0.05, 0.4)); this.nz('lowpass', 600, 100, 0.1, clamp(v * 0.6, 0.02, 0.3)); },
  hit(big) { this.tone('sine', 190, 45, 0.22, 0.75); this.nz('lowpass', 3500, 200, 0.12, 0.6, 1); if (big) this.tone('sawtooth', 900, 120, 0.3, 0.12); },
  punch(d) { const v = this.dv(d); this.tone('square', 160, 50, 0.15, 0.35 * v); this.nz('bandpass', 1800, 400, 0.1, 0.6 * v, 1.5); },
  bat() { this.tone('square', 600, 1400, 0.1, 0.18); this.nz('bandpass', 3000, 800, 0.1, 0.4, 2); },
  ko() { this.tone('sine', 1300, 160, 0.9, 0.22); this.tone('triangle', 1310, 165, 0.9, 0.12, 0.02); },
  kocrowd() { [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.12, 0.08, i * 0.07)); },
  crumble(d) { if (this.busy > 8) return; this.nz('lowpass', 500, 60, 0.45, 0.4 * this.dv(d), 0.8); },
  click() { this.tone('triangle', 660, 880, 0.06, 0.18); },
  beep(hi) { this.tone('square', hi ? 880 : 440, hi ? 880 : 440, hi ? 0.4 : 0.15, 0.16); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => { this.tone('square', f, f, i === 5 ? 0.6 : 0.14, 0.11, i * 0.12); this.tone('triangle', f / 2, f / 2, 0.2, 0.15, i * 0.12); }); },
  boing() { this.tone('sine', 180, 700, 0.18, 0.25); this.tone('sine', 700, 300, 0.12, 0.12, 0.15); },
  // --- tiny procedural music loop
  startMusic() {
    const c = this.ctx; let step = 0, next = c.currentTime + 0.1; const bpm = 126, s16 = 60 / bpm / 4;
    const bassPat = [0, 0, 7, 0, 10, 0, 7, 5, 0, 0, 7, 0, 12, 10, 7, 5];
    const roots = [45, 45, 41, 43];
    setInterval(() => {
      if (!this.ctx) return;
      const target = (this.musicOn && G.musicWanted) ? 0.2 : 0.0;
      this.mus.gain.setTargetAtTime(target, c.currentTime, 0.4);
      while (next < c.currentTime + 0.25) {
        if (target > 0) {
          const t = next - c.currentTime, s = step % 16, bar = Math.floor(step / 16) % 4;
          if (s % 4 === 0) this.tone('sine', 150, 42, 0.18, 0.9, t, this.mus);
          if (s % 4 === 2) this.nz('highpass', 7000, 6000, 0.04, 0.25, 0.5, t, this.mus);
          if (s === 4 || s === 12) this.nz('bandpass', 1800, 900, 0.12, 0.35, 0.8, t, this.mus);
          if (s % 2 === 0 || s === 15) { const n = roots[bar] + bassPat[s]; const f = 440 * Math.pow(2, (n - 69) / 12); this.tone('triangle', f, f, s16 * 1.6, 0.5, t, this.mus); }
          if (s % 8 === 6 && Math.random() < 0.5) { const n = roots[bar] + 24 + [0, 3, 7, 10][(Math.random() * 4) | 0]; const f = 440 * Math.pow(2, (n - 69) / 12); this.tone('square', f, f, 0.1, 0.06, t, this.mus); }
        }
        next += s16; step++;
      }
    }, 60);
  }
};

// ================================================================ RENDERER / SCENE
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);

      x = lerp(p.prev.x, p.pos.x, alpha); y = lerp(p.prev.y, p.pos.y, alpha); z = lerp(p.prev.z, p.pos.z, alpha); yaw = p.yaw; flags = flagsOf(p);
      if (p.kind === 'bot') { if (p.dead) flags |= 8; }
    } else {
      const s = p.interp.sample(105); if (!s) { p.vis.g.visible = false; p.vis.shadow.visible = false; p.tag.style.display = 'none'; continue; }

    p.rpos = p.rpos && p.rpos.isVector3 ? p.rpos.set(x, y, z) : new V3(x, y, z); p.rdead = !!(flags & 8);
  }
  // bombs
  if (G.isHost) for (const b of G.bombs.values()) updateBombVis(b.vis, lerp(b.prev.x, b.pos.x, alpha), lerp(b.prev.y, b.pos.y, alpha), lerp(b.prev.z, b.pos.z, alpha), b.fuse, dt);
  else {
    for (const b of G.rbombs.values()) {
      const s = b.interp.sample(105); if (!s) continue; let x = s[0], y = s[1], z = s[2];
      if (b.blend > 0) { b.from.addScaledVector(b.pvel, dt); b.pvel.y += BOMB_G * dt; const k = b.blend / 0.3; x = lerp(x, b.from.x, k); y = lerp(y, b.from.y, k); z = lerp(z, b.from.z, k); b.blend = Math.max(0, b.blend - dt); }
      updateBombVis(b.vis, x, y, z, b.fuse, dt);
    }
    for (const b of G.pbombs) updateBombVis(b.vis, b.pos.x, b.pos.y, b.pos.z, b.fuse, dt);
  }
  // barrels
  const seen = new Set();
  for (const b of G.barrels) {
    if (!b.alive) continue; seen.add(b.id); const v = getBarrelVis(b.id); v.g.visible = true;
    v.g.position.set(b.x, b.y, b.z);
    const pulse = b.fuse > 0 ? 1 + Math.sin(now * 0.08) * 0.12 : 1; v.g.scale.set(pulse, 1 / pulse, pulse);
    v.mat.emissive.set(b.fuse > 0 ? '#ff6020' : '#300000');
    if (tileAt(b.x, b.z) && b.y > -0.3) { v.shadow.visible = true; v.shadow.position.set(b.x, 0.025, b.z); const ss = clamp(0.9 - b.y * 0.04, 0.3, 0.9); v.shadow.scale.set(ss, 1, ss); } else v.shadow.visible = false;
  }
  for (const [id, v] of barrelVis) if (!seen.has(id)) { v.g.visible = false; v.shadow.visible = false; }
}

// ================================================================ UI
const myName = () => ($('nameIn').value.trim() || 'Blob').slice(0, 12);
let colorSel = store.get('color', COLORS[(Math.random() * COLORS.length) | 0]);
const myColor = () => colorSel;
function buildSwatches() {
  const w = $('swatches'); w.innerHTML = '';
  for (const c of COLORS) { const d = document.createElement('div'); d.className = 'sw' + (c === colorSel ? ' on' : ''); d.style.background = c; d.onclick = () => { colorSel = c; store.set('color', c); Snd.resume(); Snd.click(); buildSwatches(); }; w.appendChild(d); }
}
$('nameIn').value = store.get('name', '');
$('nameIn').addEventListener('input', () => store.set('name', $('nameIn').value));
buildSwatches();
const hashCode = location.hash.replace('#', '').toUpperCase(); if (/^[A-Z]{4}$/.test(hashCode)) $('codeIn').value = hashCode;

function showMenu(on) { $('menu').classList.toggle('hidden', !on); }

}
let centerTO = 0;
function centerText(t, col = '#fff') { const c = $('center'); c.textContent = t; c.style.color = col; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); clearTimeout(centerTO); centerTO = setTimeout(() => c.textContent = '', 950); }
function refreshLobby() {

  $('botN').textContent = G.botCount;
  $('hostOpts').classList.toggle('hidden', !host); $('bStart').classList.toggle('hidden', !host); $('waitTxt').classList.toggle('hidden', host);
  $('codeWrap').classList.toggle('hidden', G.mode === 'solo');

  document.querySelectorAll('#roundSeg button').forEach(b => b.classList.toggle('on', +b.dataset.r === G.rounds));
}
function sortedPlayers() { return [...G.players.values()].sort((a, b) => b.score - a.score || a.falls - b.falls); }
let boardKey = '';
function refreshBoard() {

}
function scoreTable() {
  return `<table class="st">${sortedPlayers().map((p, i) => `<tr class="${i === 0 ? 'first' : ''}"><td style="width:26px">${i + 1}</td><td><span class="dot" style="display:inline-block;vertical-align:-2px;margin-right:8px;background:${p.color}"></span>${esc(p.name)}${p.id === G.myId ? ' <span style="opacity:.6">(you)</span>' : ''}</td><td class="n">${p.score}</td><td class="n" style="opacity:.55;font-size:15px">${p.falls}↓</td></tr>`).join('')}</table>`;
}
let tabOpen = false;
function showTab(on) { if (!inGame() || G.phase === 'lobby') return; tabOpen = on; renderOverlay(); }
function renderOverlay() {
  const ov = $('overlay'), pn = $('ovPanel');
  if (!inGame()) { ov.classList.add('hidden'); return; }
  if (G.phase === 'final') {
    const w = sortedPlayers()[0];
    pn.innerHTML = `<div class="lbl" style="text-align:center">Winner</div><div id="winName" style="color:${w ? w.color : '#fff'}">${w ? esc(w.name) : ''}</div>${scoreTable()}
      ${G.isHost ? '<button id="ovAgain">PLAY AGAIN</button><div class="row"><button id="ovLobby" class="sec small">LOBBY</button><button id="ovLeave" class="red small">LEAVE</button></div>' : '<div style="text-align:center;opacity:.8;font-weight:800">Waiting for the host…</div><button id="ovLeave" class="red small">LEAVE</button>'}`;

      <div class="slider">Mouse<input id="ovSens" type="range" min="0.2" max="3" step="0.05" value="${sens}"></div>
      <div class="slider">Volume<input id="ovVol" type="range" min="0" max="1" step="0.05" value="${Snd.vol}"></div>
      <div class="slider">Music<button id="ovMus" class="small sec" style="flex:none">${Snd.musicOn ? 'ON' : 'OFF'}</button><span style="opacity:.6;font-size:13px">(M)</span></div>

function bindOv() {

  if (b('ovLobby')) b('ovLobby').onclick = () => { Snd.click(); hostToLobby(); };
  if (b('ovSens')) b('ovSens').oninput = e => { sens = +e.target.value; store.set('sens', sens); };
  if (b('ovVol')) b('ovVol').oninput = e => Snd.setVol(+e.target.value);
  if (b('ovMus')) b('ovMus').onclick = e => { Snd.musicOn = !Snd.musicOn; store.set('mus', Snd.musicOn); e.target.textContent = Snd.musicOn ? 'ON' : 'OFF'; };
}
function onLockUI() {
  const lobby = G.phase === 'lobby' && inGame();
  $('lobby').classList.toggle('hidden', !(lobby && !locked));
  $('banner').classList.toggle('hidden', !(lobby && locked));
  $('clickPlay').classList.add('hidden');
  if (lobby && locked) $('banner').textContent = G.mode === 'solo' ? 'Warm-up · Esc for lobby' : `Warm-up · Room ${G.code} · Esc for lobby`;
  $('cross').style.display = locked ? 'block' : 'none';
  renderOverlay();
}
function onPhaseUI(fromWelcome) {
  const ph = G.phase;
  G.musicWanted = ph === 'play' || ph === 'count';
  if (ph === 'count') { centerText(G.rounds > 1 ? 'ROUND ' + G.round : 'READY', '#fff'); Snd.beep(false); }
  if (ph === 'play' && !fromWelcome) { centerText('GO!', '#ffcf3f'); Snd.beep(true); shake(0.3); }
  if (ph === 'rend') { Snd.fanfare(); }
  if (ph === 'final') { Snd.fanfare(); const w = sortedPlayers()[0]; if (w) { const rp = w.vis.g.position; for (let i = 0; i < 4; i++) setTimeout(() => starBurst(rp.x, rp.y + 2, rp.z, COLORS[i]), i * 200); } if (document.pointerLockElement) document.exitPointerLock(); }
  if (ph === 'lobby' && inGame()) { if (document.pointerLockElement) document.exitPointerLock(); }
  if ((ph === 'count') && inGame() && !locked) $('clickPlay').classList.remove('hidden');

let lastCount = 0;
function updateHUD() {
  const p = me(); const ig = inGame();
  $('hud').classList.toggle('hidden', !ig);
  if (!ig) return;
  const showT = G.phase === 'play' || G.phase === 'count';
  const tl = Math.max(0, Math.ceil(G.phaseT));
  $('timer').textContent = G.phase === 'play' ? `${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, '0')}` : G.phase === 'count' ? '' : '';
  $('timer').classList.toggle('hot', G.phase === 'play' && G.phaseT < SUDDEN);
  $('roundTxt').textContent = showT ? `ROUND ${G.round} / ${G.rounds}` : '';
  if (G.phase === 'count') { const n = Math.ceil(G.phaseT - 0.2); if (n !== lastCount && n > 0 && n <= 3) { lastCount = n; centerText(String(n)); Snd.beep(false); } }
  else lastCount = 0;
  if (G.phase === 'play' && G.phaseT < SUDDEN && !G._sdShown) { G._sdShown = true; centerText('SUDDEN DEATH', '#ff5a5a'); Snd.crumble(0); }
  if (G.phase !== 'play') G._sdShown = false;
  if (p) {
    const hv = $('heatV'); const hs = String(p.heat); if (hv.textContent !== hs) { hv.textContent = hs; hv.style.color = heatColor(p.heat); hv.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' }); }
    const tf = clamp(1 - p.throwCd / THROW_CD, 0, 1), df = clamp(1 - p.dashCd / DASH_CD, 0, 1);
    $('pipT').firstChild.style.width = (tf * 100) + '%'; $('pipD').firstChild.style.width = (df * 100) + '%';
    const ring = $('cdRing'); const ch = charging ? Math.min(chargeT / 0.6, 1) : tf; ring.style.strokeDashoffset = String(107 * (1 - ch)); ring.style.stroke = charging ? '#ff6b3a' : '#ffcf3f';
  }

}

// menu buttons
function startSession(mode) {
  clearWorld(); Net.conns.clear();
  G.mode = mode; G.isHost = mode !== 'client'; G.myId = null; G.time = 0; G.round = 1; G.bombSeq = 1; G.cidSeq = 1; G.phase = 'lobby'; G.phaseT = 0;
  if (G.isHost) {
    G.myId = 'h'; const p = newPlayer('h', myName(), myColor(), 'me'); newBarrels(); fitBots(); hostSpawn(p); sendRoster();
  }
}
$('bSolo').onclick = () => { Snd.resume(); Snd.click(); G.botCount = Math.max(G.botCount, 1); startSession('solo'); showMenu(false); refreshLobby(); onLockUI(); };
$('bHost').onclick = () => {
  Snd.resume(); Snd.click(); setStatus('Opening a room…'); $('bHost').disabled = true;
  startHosting((ok, err) => {
    $('bHost').disabled = false;
    if (!ok) { setStatus(err); return; }
    setStatus(''); G.botCount = Math.min(G.botCount, 2); startSession('host'); showMenu(false); refreshLobby(); onLockUI();
  });
};
$('bJoin').onclick = () => {
  Snd.resume(); Snd.click(); const code = $('codeIn').value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { setStatus('Enter the 4-letter room code'); return; }
  setStatus('Joining ' + code + '…'); $('bJoin').disabled = true;
  clearWorld(); G.mode = 'connecting'; G.isHost = false; G.myId = null; Net.lastSnapT = 0;
  joinGame(code, (ok, err) => {
    $('bJoin').disabled = false;
    if (!ok) { setStatus(err); shutdownNet(); startAttract(); return; }
    setStatus(''); G.mode = 'client'; G.isHost = false; showMenu(false); refreshLobby(); onPhaseUI(true);
  });
};
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('bJoin').click(); });
$('bCopy').onclick = () => {
  const url = location.origin + location.pathname + '#' + G.code; Snd.click();
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { $('bCopy').textContent = 'COPIED!'; setTimeout(() => $('bCopy').textContent = 'COPY LINK', 1400); }).catch(() => { prompt('Share this link:', url); });
};
$('botM').onclick = () => { Snd.click(); G.botCount = Math.max(0, G.botCount - 1); fitBots(); sendRoster(); };
$('botP').onclick = () => { Snd.click(); G.botCount = Math.min(MAX_PLAYERS - 1, G.botCount + 1); fitBots(); G.botCount = Math.min(G.botCount, MAX_PLAYERS - humanCount()); sendRoster(); };
document.querySelectorAll('#roundSeg button').forEach(b => b.onclick = () => { Snd.click(); G.rounds = +b.dataset.r; sendRoster(); });
$('bStart').onclick = () => { Snd.click(); if (G.players.size < 2) { G.botCount = 1; fitBots(); } hostStartMatch(); requestLock(); };
$('bPlayLobby').onclick = () => { Snd.click(); requestLock(); };
$('bLeave').onclick = () => { Snd.click(); toMenu(); };
function hostToLobby() { for (const p of G.players.values()) { p.score = 0; p.falls = 0; } hostResetRound(true); setPhase('lobby', 0); }
function shutdownNet() {
  try { if (Net.host) Net.host.close(); } catch (e) { }
  for (const c of Net.conns.values()) { try { c.close(); } catch (e) { } }
  try { if (Net.peer) Net.peer.destroy(); } catch (e) { }
  Net.peer = null; Net.host = null; Net.conns.clear();
}
function toMenu(msg) {
  shutdownNet(); if (document.pointerLockElement) document.exitPointerLock();
  startAttract(); showMenu(true); setStatus(msg || ''); $('lobby').classList.add('hidden'); $('banner').classList.add('hidden'); $('overlay').classList.add('hidden'); $('hud').classList.add('hidden');
}
function startAttract() {
  clearWorld(); G.mode = 'attract'; G.isHost = true; G.myId = null; G.phase = 'attract'; G.musicWanted = false;
  newBarrels(); G.botCount = 3; for (let i = 0; i < 4; i++) addBot(); G.botCount = 3;
}

// ================================================================ MAIN LOOP
let last = performance.now(), lastRAF = 0, acc = 0, fpsAcc = 0, fpsN = 0, lowT = 0;
function simTick(now, rdt, maxSteps) {
  hitT -= rdt; slowT -= rdt;
  const paused = G.mode === 'solo' && !locked && G.phase !== 'lobby' && G.phase !== 'final';
  const scale = paused ? 0 : (hitT > 0 ? 0.05 : 1) * (slowT > 0 ? slowS : 1);
  const dt = rdt * scale;
  acc += dt; let steps = 0;
  const others = [...G.players.values()];
  while (acc >= STEP && steps < maxSteps) {
    if (G.isHost && G.mode !== 'none') hostFixed(STEP);
    if (G.myId) myFixed(STEP, others);
    if (!G.isHost) for (let i = G.pbombs.length - 1; i >= 0; i--) { const b = G.pbombs[i]; stepBomb(b, STEP); b.fuse -= STEP; if (b.age > 2.6 || b.pos.y < -40) { releaseBombMesh(b.vis); G.pbombs.splice(i, 1); } }
    acc -= STEP; steps++;
  }
  if (steps === maxSteps) acc = 0;
  // network ticks (real time)
  if (G.mode === 'host' && now - Net.lastSnap > 50) {
    Net.lastSnap = now; hostSnapshot();
    for (const c of [...Net.conns.values()]) { const p = G.players.get(c.pid); if (p && p.lastSeen && now - p.lastSeen > 20000) { try { c.close(); } catch (e) { } hostDrop(c); } }
  }
  if (G.mode === 'client' && Net.lastSnapT && now - Net.lastSnapT > 15000) { Net.lastSnapT = 0; toMenu('Lost connection to host'); }
  if (G.mode === 'client' && now - Net.lastSt > 33) {
    Net.lastSt = now; const p = me();
    if (p) toHost({ t: 'st', ts: Math.round(now), p: [r2(p.pos.x), r2(p.pos.y), r2(p.pos.z)], v: [r2(p.vel.x), r2(p.vel.y), r2(p.vel.z)], y: r2(p.yaw), f: flagsOf(p), d: p.dashId });

}
function frame(now) {
  requestAnimationFrame(frame); lastRAF = performance.now();

  fx.update(dt); chunks.update(dt); updateFlashes(dt); updateTilesVis(dt, now);
  for (const c of clouds) { if (c.userData.spin) c.rotation.y += rdt * 0.006; else c.position.y += Math.sin(now * 0.0005 + c.userData.ph) * 0.01; }
  updateCamera(dt, rdt, now); updateArc(); updateHUD();
  renderer.render(scene, camera);
  // adaptive quality
  fpsAcc += rdt; fpsN++;
  if (fpsAcc > 1) {
    const fps = fpsN / fpsAcc; $('fps').textContent = Math.round(fps) + ' fps' + (G.mode === 'client' ? ' · ' + Math.round(Net.ping) + ' ms' : '');
    if (fps < 45) lowT++; else lowT = 0;
    if (lowT >= 3 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight); lowT = 0; }
    fpsAcc = 0; fpsN = 0;
  }
}
// keep simulating + networking while the tab is hidden (browsers pause rAF in background tabs)
setInterval(() => {
  const now = performance.now(); if (!document.hidden && now - lastRAF < 250) return;
  const rdt = Math.min((now - last) / 1000, 1.2); last = now; simTick(now, rdt, 80);
}, 50);
startAttract();
requestAnimationFrame(frame);
window.__G = G; window.__dbg = { me, hostStartMatch, setPhase, keys, startSession, Net, aim: (y, p) => { camYaw = y; camPitch = p; } };
